name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Fast tests
        run: uv run pytest -q -rxX
      - name: Slow simulation tests
        # exit code 5 means no slow tests exist yet
        run: uv run pytest -q -m slow -rxX || test $? -eq 5
      - name: OpenAPI schema is up to date
        run: uv run python -m tools.export_openapi --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        # the e2e job starts the FastAPI server
      - run: uv sync --locked
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
