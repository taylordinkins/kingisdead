name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Fast tests
        run: uv run pytest -q -rxX
      - name: Slow simulation tests
        # exit code 5 means no slow tests exist yet
        run: uv run pytest -q -m slow -rxX || test $? -eq 5
